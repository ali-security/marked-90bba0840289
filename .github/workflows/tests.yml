name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional jasmine filter applied to the unit and spec suites"
        required: false
        default: ""

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        # upstream matrix was ['lts/*', 'node']; resolved here to what those
        # aliases meant at the 2021-05-27 release. Node 8 cannot run the suite
        # at all: jasmine 3.7's lib/loader.js uses dynamic import(), which is a
        # syntax error on Node 8's V8.
        node_version: [14, 16]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:unit -- --filter="${{ inputs.test-filter }}"
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:specs -- --filter="${{ inputs.test-filter }}"
          else
            npm run test:specs
          fi
      - name: Pack 🗜️
        if: matrix.node_version == 14
        run: |
          npm i -g npm@7.12.0
          npm pack
      - name: Upload package tarball
        if: matrix.node_version == 14
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error
